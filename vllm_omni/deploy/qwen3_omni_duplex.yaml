# Three-stage Qwen3-Omni-Duplex: Thinker -> Talker -> Code2Wav.
# The pipeline key forces this topology; these are not distributed --stage-id
# workers. Stage ids are zero-based and contiguous, which is what the
# orchestrator indexes its stage pools by.
#
# Top-level keys outside DeployConfig are dropped, so enforce_eager and
# async_scheduling are set per stage. async_chunk selects the streamed
# Talker -> Code2Wav edge: one frame cached per decode step, so the prefill's
# all-zero rows never reach Code2Wav.
#
# The Talker's additional_config turns on frame sync: the code predictor runs
# on the codec just sampled and the next step decodes from it, so a turn is one
# autoregressive decode. Without it the Talker lags one frame per window.
pipeline: qwen3_omni_duplex
session_mode: duplex
trust_remote_code: true
enable_prefix_caching: false
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    async_scheduling: false
    enforce_eager: true
    max_model_len: 2048
    max_num_seqs: 1
    gpu_memory_utilization: 0.775
    moe_backend: triton
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      # max_tokens is the per-window token budget and comes from the plugin.

  - stage_id: 1
    async_scheduling: false
    enforce_eager: true
    max_model_len: 2048
    max_num_batched_tokens: 2048
    max_num_seqs: 1
    gpu_memory_utilization: 0.09
    moe_backend: triton
    devices: "0"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    additional_config:
      qwen3_omni_duplex_frame_sync: true
    # The code predictor samples the 15 residual groups inside the model, where
    # vLLM's sampler seeding never reaches. Greedy there too.
    subtalker_sampling_params:
      do_sample: false
    default_sampling_params:
      temperature: 0.0
      # max_tokens is the per-window frame budget and comes from the pipeline.

  - stage_id: 2
    async_scheduling: false
    enforce_eager: true
    enable_chunked_prefill: false
    # 65536 does not start: the runner's pinned inputs_embeds buffer dies with
    # cudaErrorInvalidValue (vllm/v1/utils.py), so the window is 8192.
    max_num_batched_tokens: 8192
    max_model_len: 8192
    max_num_seqs: 1
    gpu_memory_utilization: 0.08
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1
