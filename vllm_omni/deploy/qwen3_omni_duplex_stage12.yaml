# Independent Stage 1+2 API for Qwen3-Omni-Duplex: Talker -> Code2Wav.
# The pipeline key forces this topology; these are not distributed --stage-id
# workers and do not inherit the three-stage Qwen3-Omni deployment. The Talker
# heads the pair, so it is stage 0 and Code2Wav is stage 1 whatever their
# numbers in the eventual three-stage deployment: the orchestrator indexes stage
# pools by stage_id and requires them zero-based and contiguous.
#
# The Talker is never served alone: the runner calls a stage's postprocess only
# while some request still has a downstream stage to feed, so a lone Talker
# loses talker_postprocess and the code predictor expands every frame against a
# zero last_talker_hidden. This is the smallest topology that keeps the handoff.
#
# Top-level keys outside DeployConfig are dropped, so enforce_eager and
# async_scheduling are set per stage. async_chunk is a DeployConfig field and
# stays off, so the whole turn's codes reach Code2Wav through
# talker2code2wav_full_payload rather than in streamed 25-frame chunks.
pipeline: qwen3_omni_duplex_talker_code2wav
session_mode: duplex
trust_remote_code: true
enable_prefix_caching: false
async_chunk: false

stages:
  - stage_id: 0
    async_scheduling: false
    enforce_eager: true
    max_num_seqs: 1
    gpu_memory_utilization: 0.5
    moe_backend: triton
    devices: "0"
    # The code predictor samples the 15 residual groups inside the model, where
    # vLLM's sampler seeding never reaches. Greedy there too, so a replayed turn
    # yields the same codes every run.
    subtalker_sampling_params:
      do_sample: false
    default_sampling_params:
      # Greedy, so the layer-0 codec code is reproducible as well. The native
      # Talker deploy samples at 0.9 instead; this stage exists to be compared
      # against a reference, not to sound natural.
      temperature: 0.0
      # max_tokens is the per-window frame budget and comes from the pipeline.

  - stage_id: 1
    async_scheduling: false
    # The official stage 2 keeps cudagraph on so Code2Wav can use its inner
    # graph; eager here instead, for the same reason stage 0 is eager.
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 65536
    max_num_seqs: 1
    gpu_memory_utilization: 0.2
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1
