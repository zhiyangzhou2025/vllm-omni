<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtime Duplex · vLLM Online</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; background: #f5f7fb; color: #203048; }
    body { max-width: 880px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.35rem; }
    section { background: #fff; border: 1px solid #dbe1eb; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    label { display: block; margin: .55rem 0; }
    input[type=url], input[type=text] { box-sizing: border-box; width: 100%; padding: .45rem; font: inherit; }
    button { padding: .5rem 1rem; margin-right: .5rem; font: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    .hint { color: #5b6678; font-size: .88rem; }
    .line { min-height: 1.5rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .speaker { font-weight: 600; margin: .4rem 0; }
    #log { height: 16rem; overflow: auto; white-space: pre-wrap; font: 12px/1.45 monospace; }
  </style>
</head>
<body>
  <h1>Realtime Duplex · vLLM Online</h1>
  <p class="hint">
    浏览器直连 vLLM API 服务。
    麦克风只在 <code>localhost</code> 或 HTTPS 下可用。
  </p>
  <section>
    <label>链接 <input id="url" type="url" value="ws://127.0.0.1:8093/v1/realtime" autocomplete="url"></label>
    <label>模型 <input id="model" type="text" value="qwen3-omni-duplex"></label>
    <label><input id="voice" type="checkbox" checked> 语音输出（取消勾选只返回文本）</label>
    <button id="probe" type="button">检查</button>
    <button id="start" type="button">开始</button>
    <button id="stop" type="button" disabled>结束</button>
    <button id="mute" type="button" disabled>闭麦</button>
    <p>
      连接 <span id="status">Offline</span> | 播放 <span id="playback">Off</span> | SID <span id="sid">—</span> | 已发 <span id="inTime">0.0s</span> | 已收 <span id="outTime">0.0s</span>
    </p>
  </section>
  <section>
    <p class="speaker">用户</p><div id="userText" class="line" aria-live="polite"></div>
    <p class="speaker">助手</p><div id="assistantText" class="line" aria-live="polite"></div>
  </section>
  <section>
    <p class="speaker">SYSTEM2</p>
    <label><input id="autoAnswer" type="checkbox" checked> 自动回答 <code>LAUNCH</code></label>
    <label>返回编排 <input id="answerText" type="text" value="4|结果内容。" placeholder="4|第一段结果|1|第二段结果|1|第三段结果"></label>
    <p class="hint">
      格式 <code>窗口数|内容|窗口数|内容|…</code>：第 N 次 <code>LAUNCH</code>（<code>result_index</code>=N-1）
      在发出后隔指定个时间窗（0.48 s/窗）返回对应段；最后一段为 final 并自动追加 <code>[SYSTEM2_END]</code>。
      内容里不能含 <code>|</code>。
    </p>
  </section>
  <section><p class="speaker">事件</p><div id="log" role="log"></div></section>
  <section><a id="download" hidden>下载本次会话音频</a></section>
  <script src="realtime.js"></script>
</body>
</html>
